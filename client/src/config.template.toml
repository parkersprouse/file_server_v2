# The port the browser reaches the Web File Browser server's API on.
# - release (`pnpm run release`): Caddy's HTTPS API port (8443 unless
#   WEB_FILE_BROWSER_API_PORT overrides it), which proxies to the server
server_port = 8443

# Dev-only overrides, applied automatically when Vite runs in `development`
#   mode (`pnpm dev` / `pnpm start`) and ignored by any production build.
#   Here `server_port` is the server's own port (`port` in server/config.toml),
#   which the client reaches cross-origin — no Caddy in the loop.
[dev]
server_port = 8100
